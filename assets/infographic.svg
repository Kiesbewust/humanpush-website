<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" font-family="'Inter Tight', Inter, 'Helvetica Neue', Arial, sans-serif">
<title>Zo loopt een opdracht bij HumanPush</title>
<desc>De stroom van een opdracht: het bedrijf zet een agent in, de agent bestelt en betaalt vooraf via de HumanPush-MCP, een geregistreerde professional neemt aan, werkt en tekent met zijn passkey, het bedrijf heeft 72 uur, daarna wordt de professional betaald. Elke stap staat in het logboek.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B2A5B"/></marker></defs>
<rect width="1600" height="1040" fill="#F7F5F1"/>
<text x="64" y="78" font-size="40" font-weight="700" fill="#0B2A5B" text-anchor="start" >Zo loopt een opdracht bij HumanPush</text>
<text x="64" y="114" font-size="20" font-weight="400" fill="#5C6578" text-anchor="start" >Eén methode voor elk beroep. Het protocol voert de voorwaarden uit; het logboek is het bewijs.</text>
<rect x="64.0" y="150" width="330" height="118" rx="18" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="1.5"/>
<g fill="none" stroke="#0B2A5B" stroke-width="3" stroke-linejoin="round"><rect x="100.0" y="179" width="48" height="60" rx="4"/><rect x="109.0" y="189" width="10" height="9" rx="1.5"/><rect x="127.0" y="189" width="10" height="9" rx="1.5"/><rect x="109.0" y="205" width="10" height="9" rx="1.5"/><rect x="127.0" y="205" width="10" height="9" rx="1.5"/><rect x="109.0" y="221" width="10" height="9" rx="1.5"/><rect x="127.0" y="221" width="10" height="9" rx="1.5"/><rect x="118.0" y="223" width="12" height="16"/></g>
<text x="172.0" y="202" font-size="21" font-weight="700" fill="#0B2A5B" text-anchor="start" >Bedrijf</text>
<text x="172.0" y="230" font-size="16" font-weight="400" fill="#5C6578" text-anchor="start" >met KvK-nummer</text>
<line x1="400.0" y1="209" x2="438.67" y2="209" stroke="#0B2A5B" stroke-width="2.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="444.67" y="150" width="330" height="118" rx="18" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="1.5"/>
<g fill="none" stroke="#0B2A5B" stroke-width="3" stroke-linejoin="round"><rect x="478.67" y="189" width="52" height="40" rx="12"/><line x1="504.67" y1="189" x2="504.67" y2="177"/><circle cx="504.67" cy="174" r="3.5" fill="#0B2A5B"/><circle cx="493.67" cy="207" r="4" fill="#0B2A5B"/><circle cx="515.67" cy="207" r="4" fill="#0B2A5B"/><path d="M495.67 218 Q504.67 224 513.67 218"/></g>
<text x="552.67" y="202" font-size="21" font-weight="700" fill="#0B2A5B" text-anchor="start" >Agent van het bedrijf</text>
<text x="552.67" y="230" font-size="16" font-weight="400" fill="#5C6578" text-anchor="start" >bestelt en betaalt</text>
<line x1="780.67" y1="209" x2="819.33" y2="209" stroke="#0B2A5B" stroke-width="2.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="825.33" y="150" width="330" height="118" rx="18" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="1.5"/>
<g><circle cx="885.33" cy="209" r="30" fill="#0B2A5B"/><circle cx="885.33" cy="209" r="11" fill="#E0A526"/><circle cx="906.33" cy="209.0" r="3.2" fill="#FFFFFF"/><circle cx="891.82" cy="228.97" r="3.2" fill="#FFFFFF"/><circle cx="868.34" cy="221.34" r="3.2" fill="#FFFFFF"/><circle cx="868.34" cy="196.66" r="3.2" fill="#FFFFFF"/><circle cx="891.82" cy="189.03" r="3.2" fill="#FFFFFF"/></g>
<text x="933.33" y="202" font-size="21" font-weight="700" fill="#0B2A5B" text-anchor="start" >HumanPush-MCP</text>
<text x="933.33" y="230" font-size="16" font-weight="400" fill="#5C6578" text-anchor="start" >vaste regels, logboek</text>
<line x1="1161.33" y1="209" x2="1200.0" y2="209" stroke="#0B2A5B" stroke-width="2.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="1206.0" y="150" width="330" height="118" rx="18" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="1.5"/>
<g fill="none" stroke="#0B2A5B" stroke-width="3" stroke-linejoin="round"><circle cx="1266.0" cy="193" r="13"/><path d="M1240.0 239 Q1240.0 211 1266.0 211 Q1292.0 211 1292.0 239"/><rect x="1274.0" y="219" width="14" height="10" rx="2" fill="#E0A526" stroke="none"/></g>
<text x="1314.0" y="202" font-size="21" font-weight="700" fill="#0B2A5B" text-anchor="start" >Professional</text>
<text x="1314.0" y="230" font-size="16" font-weight="400" fill="#5C6578" text-anchor="start" >uit een openbaar register</text>
<text x="1314.0" y="252" font-size="14" font-weight="500" fill="#0B2A5B" text-anchor="start" >met eigen agent of tekenscherm</text>
<text x="64" y="320" font-size="24" font-weight="700" fill="#0B2A5B" text-anchor="start" >De zes stappen</text>
<rect x="64.0" y="344" width="230" height="215" rx="18" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="1.5"/>
<circle cx="98.0" cy="382" r="18" fill="#E0A526"/>
<text x="98.0" y="389" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="middle" >1</text>
<text x="126.0" y="388" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="start" >Bestellen</text>
<text x="84.0" y="436" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >Je agent kiest een dienst,</text>
<text x="84.0" y="457" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >geeft invoer, een uiterste</text>
<text x="84.0" y="478" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >datum en een maximumprijs.</text>
<text x="84.0" y="499" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >Hij kiest geen persoon.</text>
<line x1="298.0" y1="451.5" x2="308.4" y2="451.5" stroke="#0B2A5B" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="312.4" y="344" width="230" height="215" rx="18" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="1.5"/>
<circle cx="346.4" cy="382" r="18" fill="#E0A526"/>
<text x="346.4" y="389" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="middle" >2</text>
<text x="374.4" y="388" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="start" >Vooraf betalen</text>
<text x="332.4" y="436" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >Binnen 30 minuten:</text>
<text x="332.4" y="457" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >maximumprijs plus de vaste</text>
<text x="332.4" y="478" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >vergoeding van HumanPush.</text>
<line x1="546.4" y1="451.5" x2="556.8" y2="451.5" stroke="#0B2A5B" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="560.8" y="344" width="230" height="215" rx="18" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="1.5"/>
<circle cx="594.8" cy="382" r="18" fill="#E0A526"/>
<text x="594.8" y="389" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="middle" >3</text>
<text x="622.8" y="388" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="start" >Aannemen</text>
<text x="580.8" y="436" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >Telkens 45 werkminuten,</text>
<text x="580.8" y="457" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >na elkaar, tot iemand</text>
<text x="580.8" y="478" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >aanneemt. Vangnet:</text>
<text x="580.8" y="499" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >3 werkdagen.</text>
<line x1="794.8" y1="451.5" x2="805.2" y2="451.5" stroke="#0B2A5B" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="809.2" y="344" width="230" height="215" rx="18" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="1.5"/>
<circle cx="843.2" cy="382" r="18" fill="#E0A526"/>
<text x="843.2" y="389" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="middle" >4</text>
<text x="871.2" y="378" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="start" >Werk en</text>
<text x="871.2" y="400" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="start" >handtekening</text>
<text x="829.2" y="436" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >De professional levert op,</text>
<text x="829.2" y="457" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >kiest een vaste uitkomst en</text>
<text x="829.2" y="478" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >tekent met zijn passkey.</text>
<line x1="1043.2" y1="451.5" x2="1053.6" y2="451.5" stroke="#0B2A5B" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1057.6" y="344" width="230" height="215" rx="18" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="1.5"/>
<circle cx="1091.6" cy="382" r="18" fill="#E0A526"/>
<text x="1091.6" y="389" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="middle" >5</text>
<text x="1119.6" y="388" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="start" >72 uur</text>
<text x="1077.6" y="436" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >Het bedrijf accepteert, of</text>
<text x="1077.6" y="457" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >maakt bezwaar op de vaste</text>
<text x="1077.6" y="478" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >toetspunten. Een collega</text>
<text x="1077.6" y="499" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >beslist: voldoet of voldoet</text>
<text x="1077.6" y="520" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >niet.</text>
<line x1="1291.6" y1="451.5" x2="1302.0" y2="451.5" stroke="#0B2A5B" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1306.0" y="344" width="230" height="215" rx="18" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="1.5"/>
<circle cx="1340.0" cy="382" r="18" fill="#E0A526"/>
<text x="1340.0" y="389" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="middle" >6</text>
<text x="1368.0" y="388" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="start" >Afronden</text>
<text x="1326.0" y="436" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >Na acceptatie, 72 uur</text>
<text x="1326.0" y="457" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >stilte of ‘voldoet’ krijgt</text>
<text x="1326.0" y="478" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >de professional zijn eigen</text>
<text x="1326.0" y="499" font-size="15.5" font-weight="400" fill="#0B2A5B" text-anchor="start" >tarief, zonder aftrek.</text>
<rect x="64" y="589" width="1472" height="70" rx="14" fill="#F3EFE8"/>
<text x="84" y="617" font-size="13" font-weight="700" fill="#5C6578" text-anchor="start" letter-spacing="1.5">GELD</text>
<rect x="64" y="675" width="1472" height="108" rx="14" fill="#0B2A5B"/>
<text x="84" y="703" font-size="13" font-weight="700" fill="#C9D3E6" text-anchor="start" letter-spacing="1.5">LOGBOEK</text>
<text x="84.0" y="639" font-size="14.5" font-weight="500" fill="#0B2A5B" text-anchor="start" >Maximum vast: nooit meer.</text>
<text x="84.0" y="725" font-size="14.5" font-weight="400" fill="#FFFFFF" text-anchor="start" >Bestelling + vingerafdruk</text>
<text x="84.0" y="744" font-size="14.5" font-weight="400" fill="#FFFFFF" text-anchor="start" >van de invoer + regelversie</text>
<text x="332.4" y="639" font-size="14.5" font-weight="500" fill="#0B2A5B" text-anchor="start" >100% vooraf, voordat iemand</text>
<text x="332.4" y="658" font-size="14.5" font-weight="500" fill="#0B2A5B" text-anchor="start" >begint.</text>
<text x="332.4" y="725" font-size="14.5" font-weight="400" fill="#FFFFFF" text-anchor="start" >Betaling met referentie en</text>
<text x="332.4" y="744" font-size="14.5" font-weight="400" fill="#FFFFFF" text-anchor="start" >bedrag</text>
<text x="580.8" y="639" font-size="14.5" font-weight="500" fill="#0B2A5B" text-anchor="start" >Lagere eigen prijs? Verschil</text>
<text x="580.8" y="658" font-size="14.5" font-weight="500" fill="#0B2A5B" text-anchor="start" >direct terug.</text>
<text x="580.8" y="725" font-size="14.5" font-weight="400" fill="#FFFFFF" text-anchor="start" >Register opnieuw</text>
<text x="580.8" y="744" font-size="14.5" font-weight="400" fill="#FFFFFF" text-anchor="start" >gecontroleerd + aanname</text>
<text x="580.8" y="763" font-size="14.5" font-weight="400" fill="#FFFFFF" text-anchor="start" >getekend met passkey</text>
<text x="829.2" y="639" font-size="14.5" font-weight="500" fill="#0B2A5B" text-anchor="start" >Geld staat vast tot het</text>
<text x="829.2" y="658" font-size="14.5" font-weight="500" fill="#0B2A5B" text-anchor="start" >venster sluit.</text>
<text x="829.2" y="725" font-size="14.5" font-weight="400" fill="#FFFFFF" text-anchor="start" >Vingerafdruk van het stuk +</text>
<text x="829.2" y="744" font-size="14.5" font-weight="400" fill="#FFFFFF" text-anchor="start" >handtekening</text>
<text x="1077.6" y="639" font-size="14.5" font-weight="500" fill="#0B2A5B" text-anchor="start" >Voldoet niet: alles terug.</text>
<text x="1077.6" y="725" font-size="14.5" font-weight="400" fill="#FFFFFF" text-anchor="start" >Acceptatie, bezwaar of</text>
<text x="1077.6" y="744" font-size="14.5" font-weight="400" fill="#FFFFFF" text-anchor="start" >stilte; oordeel getekend</text>
<text x="1326.0" y="639" font-size="14.5" font-weight="500" fill="#0B2A5B" text-anchor="start" >HumanPush houdt alleen zijn</text>
<text x="1326.0" y="658" font-size="14.5" font-weight="500" fill="#0B2A5B" text-anchor="start" >vergoeding.</text>
<text x="1326.0" y="725" font-size="14.5" font-weight="400" fill="#FFFFFF" text-anchor="start" >Uitbetaling + export die</text>
<text x="1326.0" y="744" font-size="14.5" font-weight="400" fill="#FFFFFF" text-anchor="start" >iedereen kan controleren</text>
<line x1="180" y1="697" x2="1510" y2="697" stroke="#E0A526" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
<text x="1516" y="702" font-size="12" font-weight="400" fill="#0B2A5B" text-anchor="start" ></text>
<text x="64" y="815" font-size="22" font-weight="700" fill="#0B2A5B" text-anchor="start" >Als het anders loopt: vaste uitkomsten, geen uitzonderingen</text>
<rect x="64.0" y="833" width="281.6" height="106" rx="14" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="1.5"/>
<text x="82.0" y="863" font-size="17" font-weight="700" fill="#0B2A5B" text-anchor="start" >Niemand neemt aan</text>
<text x="82.0" y="889" font-size="14.5" font-weight="400" fill="#5C6578" text-anchor="start" >Alles terug, ook de vergoeding.</text>
<rect x="361.6" y="833" width="281.6" height="106" rx="14" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="1.5"/>
<text x="379.6" y="863" font-size="17" font-weight="700" fill="#0B2A5B" text-anchor="start" >Annuleren na aanname</text>
<text x="379.6" y="889" font-size="14.5" font-weight="400" fill="#5C6578" text-anchor="start" >Professional krijgt 25% van zijn</text>
<text x="379.6" y="908" font-size="14.5" font-weight="400" fill="#5C6578" text-anchor="start" >eigen prijs. De rest en de</text>
<text x="379.6" y="927" font-size="14.5" font-weight="400" fill="#5C6578" text-anchor="start" >vergoeding gaan terug.</text>
<rect x="659.2" y="833" width="281.6" height="106" rx="14" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="1.5"/>
<text x="677.2" y="863" font-size="17" font-weight="700" fill="#0B2A5B" text-anchor="start" >Te laat of terugtrekken</text>
<text x="677.2" y="889" font-size="14.5" font-weight="400" fill="#5C6578" text-anchor="start" >Alles terug. Telt als tekortkoming</text>
<text x="677.2" y="908" font-size="14.5" font-weight="400" fill="#5C6578" text-anchor="start" >voor de professional.</text>
<rect x="956.8" y="833" width="281.6" height="106" rx="14" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="1.5"/>
<text x="974.8" y="863" font-size="17" font-weight="700" fill="#0B2A5B" text-anchor="start" >Schorsing of doorhaling</text>
<text x="974.8" y="889" font-size="14.5" font-weight="400" fill="#5C6578" text-anchor="start" >Nog niet opgeleverd: alles terug.</text>
<text x="974.8" y="908" font-size="14.5" font-weight="400" fill="#5C6578" text-anchor="start" >De professional krijgt niets.</text>
<rect x="1254.4" y="833" width="281.6" height="106" rx="14" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="1.5"/>
<text x="1272.4" y="863" font-size="17" font-weight="700" fill="#0B2A5B" text-anchor="start" >Na oplevering annuleren</text>
<text x="1272.4" y="889" font-size="14.5" font-weight="400" fill="#5C6578" text-anchor="start" >Kan niet. Wel bezwaar binnen 72</text>
<text x="1272.4" y="908" font-size="14.5" font-weight="400" fill="#5C6578" text-anchor="start" >uur.</text>
<text x="64" y="1006" font-size="14.5" font-weight="500" fill="#0B2A5B" text-anchor="start" >Registerbewijs: minimaal niveau 2 (een mens controleert het openbare register met een vaste checklist), hooguit 30 dagen oud, opnieuw gecontroleerd bij elke aanname.</text>
<text x="64" y="1026" font-size="13" font-weight="400" fill="#5C6578" text-anchor="start" >Bedragen en termijnen zijn testwaarden in de testfase. HumanPush is een handelsnaam van HumAgent B.V. · KvK 42222476</text>
</svg>