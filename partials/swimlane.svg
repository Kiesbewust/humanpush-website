<svg class="hp-swim" xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 1244 542" role="img" aria-labelledby="sw-t sw-d" font-family="Instrument Sans, Inter, system-ui, sans-serif">
<title id="sw-t">Hoe HumanPush werkt, stap voor stap</title>
<desc id="sw-d">Swimlane in vier banen: agent van het bedrijf, HumanPush, professional en geld. 1 de agent kiest een dienst. 2 HumanPush legt het aanbod vast. 3 het bedrijf betaalt vooraf. 4 de wachtrij wordt gebouwd. 5 een professional krijgt een beurt; neemt hij niet aan, dan volgt de volgende, tot iemand aanneemt. 6 hij neemt aan en tekent met zijn passkey. 7 het prijsverschil gaat terug. 8 hij levert op en tekent. 9 het bewijs wordt vastgelegd en het bedrijf heeft 72 uur voor bezwaar. 10 de agent haalt het stuk op. 11 de professional wordt betaald. Neemt niemand aan, dan gaat alles terug.</desc>
