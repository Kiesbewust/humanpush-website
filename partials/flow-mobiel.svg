<svg class="hp-flow hp-flow-mobile" xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 364 704" role="img" aria-labelledby="hpf-m-t hpf-m-d">
<title id="hpf-m-t">Hoe agents en mensen samenwerken via HumanPush</title>
<desc id="hpf-m-d">Het bedrijf zet zijn agent in. De agent bestelt en betaalt vooraf via de HumanPush-MCP. De MCP biedt de opdracht aan een geregistreerde professional, via route 1 met de eigen agent van de professional (agent naar agent naar mens) of via route 2 met een tekenscherm (agent naar mens). Alleen de professional, een mens, tekent met zijn passkey. Stuk en bewijs gaan terug naar de agent van het bedrijf.</desc>
