<text x="550.0" y="121" text-anchor="middle" font-size="12.5" fill="#D6DEEE">Betaling vooraf</text>
<text x="550.0" y="137" text-anchor="middle" font-size="12.5" fill="#D6DEEE">Registerbewijs niveau 2</text>
<text x="550.0" y="153" text-anchor="middle" font-size="12.5" fill="#D6DEEE">Ondertekend logboek</text>
<text x="550.0" y="169" text-anchor="middle" font-size="12.5" fill="#D6DEEE"></text>
<text x="550.0" y="185" text-anchor="middle" font-size="12.5" fill="#D6DEEE">Elke stap is een aanroep</text>
<text x="550.0" y="201" text-anchor="middle" font-size="12.5" fill="#D6DEEE">of bericht in het protocol</text>
<rect x="1010" y="40" width="190" height="340" rx="14" fill="#FFFFFF" stroke="#0B2A5B" stroke-width="1.5"/>
<text x="1105.0" y="62" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5C6578">MENS</text>
<text x="1105.0" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#0B2A5B">Geregistreerde</text>
<text x="1105.0" y="103" text-anchor="middle" font-size="16" font-weight="700" fill="#0B2A5B">professional</text>
<rect x="1079.0" y="110" width="52" height="3" rx="1.5" fill="#E0A526"/>
<text x="1105.0" y="132" text-anchor="middle" font-size="12.5" fill="#5C6578">NIVRE · NRVT · NRGD</text>
<text x="1105.0" y="148" text-anchor="middle" font-size="12.5" fill="#5C6578">octrooigemachtigde · NRBI</text>
<text x="1105.0" y="164" text-anchor="middle" font-size="12.5" fill="#5C6578"></text>
<text x="1105.0" y="180" text-anchor="middle" font-size="12.5" fill="#5C6578">Doet het werk en</text>
<text x="1105.0" y="196" text-anchor="middle" font-size="12.5" fill="#5C6578">tekent met zijn passkey.</text>
