<text x="715" y="108" text-anchor="middle" font-size="12" font-weight="500" fill="#5C6578">biedt aan,</text>
<text x="715" y="146" text-anchor="middle" font-size="12" font-weight="500" fill="#5C6578">in beurten</text>
<line x1="650" y1="317" x2="780" y2="317" stroke="#0B2A5B" stroke-width="2" marker-start="url(#hpf-ah-d)" marker-end="url(#hpf-ah-d)"/>
<text x="715" y="298" text-anchor="middle" font-size="12" font-weight="500" fill="#5C6578">biedt aan,</text>
<text x="715" y="340" text-anchor="middle" font-size="12" font-weight="500" fill="#5C6578">toont wat je tekent</text>
<line x1="940" y1="127" x2="1010" y2="127" stroke="#0B2A5B" stroke-width="2" marker-start="url(#hpf-ah-d)" marker-end="url(#hpf-ah-d)"/>
<line x1="940" y1="317" x2="1010" y2="317" stroke="#0B2A5B" stroke-width="2" marker-start="url(#hpf-ah-d)" marker-end="url(#hpf-ah-d)"/>
