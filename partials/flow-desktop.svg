<svg class="hp-flow hp-flow-desktop" xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 1204 424" role="img" aria-labelledby="hpf-d-t hpf-d-d">
<title id="hpf-d-t">Hoe agents en mensen samenwerken via HumanPush</title>
<desc id="hpf-d-d">Het bedrijf zet zijn agent in. De agent bestelt en betaalt vooraf via de HumanPush-MCP en krijgt het stuk met bewijs terug. De MCP biedt de opdracht in beurten aan een geregistreerde professional, via route 1 met de eigen agent van de professional (agent naar agent naar mens) of via route 2 met een tekenscherm (agent naar mens). Alleen de professional, een mens, tekent met zijn passkey.</desc>
<defs><marker id="hpf-ah-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B2A5B"/></marker></defs>
<rect x="680" y="40" width="320" height="150" rx="16" fill="#F3EFE8"/>
<rect x="680" y="230" width="320" height="150" rx="16" fill="#F3EFE8"/>
<text x="696" y="62" font-size="11.5" font-weight="700" letter-spacing="0.6" fill="#0B2A5B">ROUTE 1 · AGENT ↔ AGENT ↔ MENS</text>
<text x="696" y="252" font-size="11.5" font-weight="700" letter-spacing="0.6" fill="#0B2A5B">ROUTE 2 · AGENT ↔ MENS</text>
<rect x="450" y="40" width="200" height="340" rx="14" fill="#0B2A5B" stroke="#0B2A5B" stroke-width="1.5"/>
