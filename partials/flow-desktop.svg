<text x="860.0" y="349" text-anchor="middle" font-size="12.5" fill="#5C6578">passkey-login</text>
<line x1="130" y1="210" x2="180" y2="210" stroke="#0B2A5B" stroke-width="2" marker-start="url(#hpf-ah-d)" marker-end="url(#hpf-ah-d)"/>
<text x="155" y="196" text-anchor="middle" font-size="12" font-weight="500" fill="#5C6578">zet in</text>
